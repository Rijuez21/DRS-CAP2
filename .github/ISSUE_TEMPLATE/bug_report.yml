# Save as .github/ISSUE_TEMPLATE/bug_report.yml in your repo.
# GitHub shows this as a form when someone clicks New issue > Bug report.
name: Bug report
description: A problem found while testing DRS Bus with Postman (API), JMeter (load) or ZAP (security).
title: "[Bug] "
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. One bug per issue. Test in **test mode** (never on the live Railway app), and attach the report or a link to the GitHub Actions run when you can.

  - type: dropdown
    id: test-type
    attributes:
      label: Found by
      description: Which kind of testing found it?
      options:
        - API test (Postman)
        - Load test (JMeter)
        - Security test (ZAP)
        - Other (found while using the app)
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is it for users?
      options:
        - Critical (data loss, security hole, or the app can't be used)
        - High (a main feature is broken, no workaround)
        - Medium (broken, but there is a workaround)
        - Low (looks wrong, small inconvenience)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Passenger
        - Driver
        - Terminal staff
        - Admin
        - Bus owner
        - Server (API or hosting)
    validations:
      required: true

  - type: input
    id: test-case
    attributes:
      label: Test case ID
      description: The Postman request name, the JMeter test (load, stress or spike), or the ZAP alert name and ID.
      placeholder: "e.g. ZAP alert 10020, Missing Anti-clickjacking Header"

  - type: input
    id: environment
    attributes:
      label: Test environment
      description: Where you ran the test.
      placeholder: "e.g. Local test mode (Docker MySQL + Redis), ZAP 2.17.0, or GitHub Actions run #42"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else can follow to see the same result.
      placeholder: |
        1. Start test mode (API + preview)
        2. Run the ZAP Automated Scan on http://localhost:4173
        3. Open Alerts > ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead. Include the exact error message or status code.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Report, logs or screenshot
      description: Paste the failing request and status code, the JMeter summary (requests, errors, p95) or the ZAP alert. Attach the HTML report or link the GitHub Actions run. Never paste tokens, passwords or .env contents.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I reproduced it in test mode, not on the live Railway app.
          required: true
